---
layout: default
---

<a class="back" href="{{ '/' | relative_url }}">&lt;- back to index</a>

{% if page.kind or page.date %}
<div class="meta">
  {% if page.kind %}<span class="kind{% if page.kind == 'NOTES' %} n{% endif %}">{{ page.kind }}</span>{% endif %}
  {% if page.date %}<span class="date">{{ page.date | date: "%Y-%m-%d" }}</span>{% endif %}
</div>
{% endif %}

<article class="post">
  {{ content }}
</article>
